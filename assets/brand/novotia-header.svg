<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#C4B5FD"/>
      <stop offset="70%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="70%" stop-color="#E879F9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top cybernetic accent bracket -->
  <path d="M 320 20 L 350 20 L 360 30" stroke="#67E8F9" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 580 20 L 550 20 L 540 30" stroke="#67E8F9" stroke-width="1.2" fill="none" opacity="0.6"/>
  <circle cx="450" cy="20" r="2.5" fill="#67E8F9" filter="url(#glow)"/>

  <!-- Logo Monogram Icon in Center Top -->
  <g transform="translate(427, 26)">
    <!-- Hexagonal outer ring -->
    <polygon points="23,0 42,11 42,33 23,44 4,33 4,11" fill="none" stroke="url(#subGrad)" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Stylized N -->
    <path d="M 14 31 L 14 13 L 32 31 L 32 13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="11" r="1.5" fill="#67E8F9"/>
  </g>

  <!-- Main Wordmark -->
  <text x="450" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Space Grotesk', sans-serif" font-size="44" font-weight="800" letter-spacing="14" fill="url(#textGrad)" filter="url(#glow)">NOVOTIA LABS</text>

  <!-- Luminous Horizon Line -->
  <line x1="180" y1="124" x2="720" y2="124" stroke="url(#accentLine)" stroke-width="1.2" filter="url(#glow)"/>

  <!-- Subtitle Tagline -->
  <text x="450" y="146" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', -apple-system, monospace" font-size="11.5" font-weight="500" letter-spacing="6" fill="#67E8F9" opacity="0.95">ENGINEERING THE UNIMAGINED</text>
</svg>
