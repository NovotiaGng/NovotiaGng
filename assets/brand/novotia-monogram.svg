<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="mono-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="mono-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="mono-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer hexagonal ring -->
  <polygon points="60,8 104,32 104,88 60,112 16,88 16,32" fill="none" stroke="url(#mono-outer)" stroke-width="1.5" opacity="0.7" filter="url(#mono-glow)"/>
  <!-- Inner hexagonal ring -->
  <polygon points="60,22 90,40 90,80 60,98 30,80 30,40" fill="none" stroke="url(#mono-outer)" stroke-width="1" opacity="0.4"/>
  <!-- N letterform -->
  <text x="60" y="72" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="url(#mono-inner)" filter="url(#mono-glow)">N</text>
</svg>
