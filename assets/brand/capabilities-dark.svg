<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img"><title>Agentic AI, mobile and Web3, software systems.</title><defs><style>
.m{transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin var(--T,30s) linear infinite}
.rev{animation-direction:reverse}
@keyframes sig{0%{transform:scale(1);opacity:.7}100%{transform:scale(var(--S,3.4));opacity:0}}
.sig{animation:sig 4.2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.breathe{animation:breathe 3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.nudge{animation:nudge 1.8s ease-in-out infinite}
@keyframes rise{from{transform:translateY(110px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
@keyframes draw{0%{stroke-dashoffset:1;stroke-opacity:1}70%{stroke-dashoffset:0;stroke-opacity:1}100%{stroke-dashoffset:0;stroke-opacity:0}}
@keyframes fillin{from{fill-opacity:0}to{fill-opacity:1}}
.wm{stroke-dasharray:1;stroke-opacity:0;stroke-width:2.2;animation:draw 1.5s cubic-bezier(.4,0,.2,1) var(--d,0s) both,fillin .7s ease-out calc(var(--d,0s) + .9s) both}
@keyframes ecg{from{stroke-dashoffset:22}to{stroke-dashoffset:-78}}
.ecg{animation:ecg 3s linear infinite}
@keyframes marq{to{transform:translateX(var(--W))}}
.marq{animation:marq var(--T,34s) linear infinite}
@keyframes pop{from{opacity:.35;transform:scale(.78)}to{opacity:1;transform:none}}
.pop{animation:pop .6s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.float{animation:float 4s ease-in-out var(--d,0s) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes pk{0%{transform:translate(0,0);opacity:0}2%{opacity:1}14%{transform:translate(var(--dx),var(--dy));opacity:1}16%,100%{transform:translate(var(--dx),var(--dy));opacity:0}}@keyframes fk{0%,12%{opacity:0}14%{opacity:1}34%,100%{opacity:0}}@keyframes mv{0%{transform:translateX(0);opacity:0}5%{opacity:1}85%{transform:translateX(222px);opacity:1}92%,100%{transform:translateX(222px);opacity:0}}@keyframes bk0{0%,31%{opacity:0}33%{opacity:1}53%,100%{opacity:0}}@keyframes bk1{0%,57%{opacity:0}59%{opacity:1}79%,100%{opacity:0}}@keyframes bk2{0%,82%{opacity:0}84%{opacity:1}99%,100%{opacity:0}}@keyframes l0{0%,18%{opacity:1}22%,86%{opacity:0}90%,100%{opacity:1}}@keyframes l1{0%,20%{opacity:0}24%,40%{opacity:1}44%,62%{opacity:0}66%,84%{opacity:1}88%,100%{opacity:0}}@keyframes l2{0%,40%{opacity:0}44%,62%{opacity:1}66%,100%{opacity:0}}</style></defs><g transform="translate(0 0)"><rect width="384" height="290" rx="16" fill="#21262d"/><path d="M192 92L192 28" stroke="#3d444d" stroke-width="4" stroke-linecap="round"/><path d="M192 92L247.4 60" stroke="#3d444d" stroke-width="4" stroke-linecap="round"/><path d="M192 92L247.4 124" stroke="#3d444d" stroke-width="4" stroke-linecap="round"/><path d="M192 92L192 156" stroke="#3d444d" stroke-width="4" stroke-linecap="round"/><path d="M192 92L136.6 124" stroke="#3d444d" stroke-width="4" stroke-linecap="round"/><path d="M192 92L136.6 60" stroke="#3d444d" stroke-width="4" stroke-linecap="round"/><circle cx="192" cy="28" r="10" fill="#3d444d"/><circle cx="192" cy="28" r="10" fill="#2dd4bf" style="opacity:0;animation:fk 6s linear 0s infinite both"/><circle cx="192" cy="92" r="5" fill="#2dd4bf" style="--dx:0px;--dy:-64px;opacity:0;animation:pk 6s linear 0s infinite both"/><circle cx="247.4" cy="60" r="10" fill="#3d444d"/><circle cx="247.4" cy="60" r="10" fill="#2dd4bf" style="opacity:0;animation:fk 6s linear 1s infinite both"/><circle cx="192" cy="92" r="5" fill="#2dd4bf" style="--dx:55.4px;--dy:-32px;opacity:0;animation:pk 6s linear 1s i