acity:0;animation:l2 5s linear infinite"><rect x="48" y="118" width="288" height="38" rx="10" fill="#2dd4bf"/><text x="68" y="143" font-size="18" font-weight="600" fill="#04201c">Data</text></g><text x="32" y="236" font-size="30" font-weight="800" letter-spacing="-.5" fill="#e6edf3">Software systems</text><text x="32" y="266" font-size="18" fill="#8b949e">Backends, APIs, cloud</text></g></svg>