<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" fill="none">
  <defs>
    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#E879F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <filter id="fglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Top luminous horizon line -->
  <line x1="100" y1="10" x2="900" y2="10" stroke="url(#footer-line)" stroke-width="1" filter="url(#fglow)"/>
  <circle cx="500" cy="10" r="2.5" fill="#67E8F9" filter="url(#fglow)"/>

  <!-- Footer text -->
  <text x="500" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', monospace" font-size="11" font-weight="500" letter-spacing="5" fill="#94A3B8">© NOVOTIA LABS · BUILDING WITH PURPOSE · ENGINEERING FOR IMPACT</text>
  <text x="500" y="64" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="400" letter-spacing="3" fill="#64748B">THE NEXT FRONTIER IS BUILT, NOT PREDICTED.</text>
</svg>
