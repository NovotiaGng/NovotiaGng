<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 135" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C4B5FD"/>
      <stop offset="70%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="75%" stop-color="#E879F9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cybernetic Corner Brackets -->
  <path d="M 330 14 L 355 14 L 365 24" stroke="#67E8F9" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M 570 14 L 545 14 L 535 24" stroke="#67E8F9" stroke-width="1.2" fill="none" opacity="0.6"/>
  <circle cx="450" cy="14" r="2" fill="#67E8F9" filter="url(#glow)"/>

  <!-- Logo Monogram Icon in Center Top -->
  <g transform="translate(432, 14)">
    <polygon points="18,0 33,9 33,26 18,35 3,26 3,9" fill="none" stroke="url(#subGrad)" stroke-width="1.4" filter="url(#glow)"/>
    <path d="M 11 25 L 11 10 L 25 25 L 25 10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="8.5" r="1.2" fill="#67E8F9"/>
  </g>

  <!-- Main Wordmark -->
  <text x="450" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Space Grotesk', sans-serif" font-size="40" font-weight="800" letter-spacing="12" fill="url(#textGrad)" filter="url(#glow)">NOVOTIA LABS</text>

  <!-- Luminous Horizon Line -->
  <line x1="220" y1="102" x2="680" y2="102" stroke="url(#accentLine)" stroke-width="1" filter="url(#glow)"/>

  <!-- Subtitle Tagline -->
  <text x="450" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="6" fill="#67E8F9" opacity="0.95">ENGINEERING THE UNIMAGINED</text>
</svg>
