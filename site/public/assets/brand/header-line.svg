<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" fill="none">
  <defs>
    <linearGradient id="hl-gradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0B0D1A" stop-opacity="0"/>
      <stop offset="15%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.6"/>
      <stop offset="85%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0D1A" stop-opacity="0"/>
    </linearGradient>
    <filter id="hl-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="50" y1="25" x2="750" y2="25" stroke="url(#hl-gradient)" stroke-width="0.6" filter="url(#hl-glow)"/>
  <!-- Decorative dots -->
  <circle cx="395" cy="25" r="2" fill="#67E8F9" opacity="0.8" filter="url(#hl-glow)"/>
  <circle cx="405" cy="25" r="2" fill="#8B5CF6" opacity="0.8" filter="url(#hl-glow)"/>
</svg>
